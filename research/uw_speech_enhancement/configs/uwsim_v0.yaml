# uwsim v0 simulator configuration (RESEARCH_PLAN.md section 4.2 randomization ranges).
# calibrated: false -> every "measured" item is an uncalibrated textbook/placeholder value:
#   chain FIRs (h1/h2/h3, hydrophone) = identity/linear, directivity = piston a = 0.117 m,
#   T60 per octave, preamp corner, codec floor, measured SNR range, boundary priors.
# Replace them with the section 4.3 fit at gate G3 and set calibrated: true.
# Ranges are [lo, hi] sampled uniformly. Load with uwse.uwsim.config.load_config.
