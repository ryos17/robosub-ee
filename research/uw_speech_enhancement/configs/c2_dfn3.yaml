# C2: DeepFilterNet3, full fine-tuning on uwsim v0 (RESEARCH_PLAN.md §7.3, §7.4).
# MVR: 3 seeds. C3 (LoRA) = this file with
#   --set train.param_mode=lora --set train.lr=1e-3 --set train.max_steps=30000 --set run_name=c3_dfn3_lora
# (weight_decay: null resolves to 0 for LoRA, §7.4). The dfn3 adapter inserts LoRA on its
# GRUs + Linear layers in trainable_params("lora"); rank via adapter.kwargs.lora_r/lora_alpha.
# Launch detached (see scripts/train.py docstring), log to $env:TEMP\c2_dfn3.log.
run_name: c2_dfn3
condition: C2
task: se
adapter:
  name: dfn3            # 48 kHz; data are generated at adapter.sample_rate
  kwargs:
    loss_name: native   # DFN3's own losses (§7.2)
data:
  kind: uwsim
  train_clean: data/librispeech/LibriSpeech/train-clean-100   # sim-train speakers (§5.4)
  val_clean: data/librispeech/LibriSpeech/dev-clean           # sim-val speakers (§5.4)
  noise_root: data/noise            # unit A / train split only (§5.2)
  sim_config: configs/uwsim_v0.yaml # frozen at G3
  rir_bank: data/rirs/uwsim_v0      # 20k RIRs (§5.3); null -> render per item (slow)
  target: R1                        # R1_sim = s * h_chain (§8.2)
  n_train_items: 1000000            # virtual length; items drawn with replacement
  n_val_items: 900                  # ~2 h at 8 s per crop (sim-val-2h, §5.3)
  val_seed: 20261027
  val_dir: data/frozen/sim_val_2h_dfn3_48k
train:
  out_dir: runs
  lr: 1.0e-4            # §7.4 DFN3 peak LR
  betas: [0.9, 0.999]
  weight_decay: null    # resolved by param_mode: 1e-4 full, 0 lora (§7.4)
  warmup_steps: 1000
  max_steps: 50000      # cap; reduce after the W4 throughput measurement
  grad_clip: 5.0
  param_mode: full
  audio_s_per_step: 64.0
  segment_s: 4.0
  batch_size: 4         # micro-batch; accum = ceil(64 / (4 * 4)) = 4
  val_segment_s: 8.0
  val_batch_size: 4
  amp: false            # turn on (bf16) only after checking DFN3's loss under autocast
  eval_every: 2000
  patience: 5
  log_every: 50
  ckpt_every: 1000
  num_workers: 4
seeds: [0, 1, 2]
