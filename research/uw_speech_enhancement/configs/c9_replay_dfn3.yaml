# C9: measured-IR replay fine-tuning (RQ2c; F3 insurance), started in W4.
# IRs from the calibration and validation positions ONLY, never the benchmark
# positions (RESEARCH_PLAN.md §5.3); files whose path contains an `exclude` string are
# dropped. Perturbations: time-stretch +-10 %, per-octave gain +-2 dB, tail resynthesis.
run_name: c9_replay_dfn3
condition: C9
task: se
adapter:
  name: dfn3
  kwargs:
    loss_name: native
data:
  kind: replay
  train_clean: data/librispeech/LibriSpeech/train-clean-100
  val_clean: data/librispeech/LibriSpeech/dev-clean
  noise_root: data/noise
  ir_dir: data/irs/replay           # chain-compensated measured IRs (S1 calibration + validation)
  chain_fir: null                   # measured h_chain (.npy at fs_sim); null -> identity (R0)
  sim_config: configs/uwsim_v0.yaml # SNR and level ranges are read from here (same rule as C2)
  n_train_items: 1000000
  n_val_items: 900
  val_seed: 20261027
  val_dir: data/frozen/sim_val_2h_replay_48k
  params:
    stretch: 0.10
    band_gain_db: 2.0
    p_tail: 0.5
    exclude: [bench, benchmark]
    max_ir_s: 2.0
    # snr_range / level_dbfs_range: taken from sim_config (uwsim noise.snr_* and chain.level_dbfs)
train:
  out_dir: runs
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: null    # resolved by param_mode: 1e-4 full, 0 lora (§7.4)
  warmup_steps: 1000
  max_steps: 50000
  grad_clip: 5.0
  param_mode: full
  audio_s_per_step: 64.0
  segment_s: 4.0
  batch_size: 4
  val_segment_s: 8.0
  val_batch_size: 4
  amp: false
  eval_every: 2000
  patience: 5
  log_every: 50
  ckpt_every: 1000
  num_workers: 4
seeds: [0]
